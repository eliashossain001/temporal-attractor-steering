[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal_conflict"
version = "1.0.0"
description = "Parametric Temporal Conflict detection and Temporal Attractor Steering."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Anonymous Authors" }]
dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.30",
    "sentencepiece>=0.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.scripts]
temporal-conflict = "temporal_conflict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["temporal_conflict*"]
