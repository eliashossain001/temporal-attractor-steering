# Open-weight model registry for PTC screening (Phase 1).
# Keys here are passed via --model to scripts/run_ptc_screening.py.
# Add/remove entries freely; precision and trust_remote_code are per-model.

models:
  # ---- Pythia (central to the frequency-recency analysis: Pile + checkpoints) ----
  pythia-410m:
    hf_id: EleutherAI/pythia-410m
    family: pythia
    dtype: float16
  pythia-1.4b:
    hf_id: EleutherAI/pythia-1.4b
    family: pythia
    dtype: float16
  pythia-2.8b:
    hf_id: EleutherAI/pythia-2.8b
    family: pythia
    dtype: float16
  pythia-6.9b:
    hf_id: EleutherAI/pythia-6.9b
    family: pythia
    dtype: float16

  # ---- Llama-3 (base) ----
  llama-3.2-1b:
    hf_id: meta-llama/Llama-3.2-1B
    family: llama
    dtype: float16
  llama-3.2-3b:
    hf_id: meta-llama/Llama-3.2-3B
    family: llama
    dtype: float16
  llama-3.1-8b:
    hf_id: meta-llama/Llama-3.1-8B
    family: llama
    dtype: float16

  # ---- Qwen-2.5 (base) ----
  qwen-2.5-1.5b:
    hf_id: Qwen/Qwen2.5-1.5B
    family: qwen
    dtype: float16
  qwen-2.5-7b:
    hf_id: Qwen/Qwen2.5-7B
    family: qwen
    dtype: float16

  # ---- Mistral (base) ----
  mistral-7b-v0.3:
    hf_id: mistralai/Mistral-7B-v0.3
    family: mistral
    dtype: float16

  # ---- Gemma-2 (base) ----
  gemma-2-2b:
    hf_id: google/gemma-2-2b
    family: gemma
    dtype: float16
  gemma-2-9b:
    hf_id: google/gemma-2-9b
    family: gemma
    dtype: float16

# Default prompt formatting for base-LM completion scoring.
# The full text fed to the model is: prompt + answer_suffix + candidate_prefix + candidate
# We score only the candidate tokens.
prompting:
  answer_suffix: "\nAnswer:"
  candidate_prefix: " "
